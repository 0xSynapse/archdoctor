[package]
name = "archdoctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Arch Linux health check, history diff and triage"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
